<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web-dualshock demo (dev)</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2em;
      }
      #log,
      #log2 {
        white-space: pre;
        background: #222;
        color: #0f0;
        padding: 1em;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>web-dualshock demo (dev)</h1>
    <button id="connect">Connect PS4 controller</button>
    <p>
      <!-- color picker-->
      <label> LED color</label>
      <input id="colorPicker" type="color" value="#000000" />
    </p>
    <p>
      <label> LED RED </label
      ><input id="colorRed" type="range" value="0" min="0" max="255" />
    </p>

    <p>
      <label> LED GREEN </label
      ><input id="colorGreen" type="range" value="0" min="0" max="255" />
    </p>
    <p>
      <label> LED BLUE </label
      ><input id="colorBlue" type="range" value="0" min="0" max="255" />
    </p>
    <p>
      <label>Soft Rumble</label>
      <input id="softRumble" type="range" value="0" min="0" max="255" />
    </p>
    <p>
      <label>Heavy Rumble</label>
      <input id="heavyRumble" type="range" value="0" min="0" max="255" />
    </p>
    <p>
      <label> Light blink on </label>
      <input id="lightBlink" type="range" value="0" min="0" max="255" />
    </p>
    <p>
      <label> Light blink off </label>
      <input id="lightBlinkOff" type="range" value="0" min="0" max="255" />
    </p>
    <p>
      <label for="musicFile">Audio file (MP3, WAV or SBC)</label>
      <input id="musicFile" type="file" accept="audio/*,.sbc" />
    </p>
    <p>
      <button id="previewAudio" disabled>Listen to converted audio</button>
      <button id="sendAudio" disabled>Play on PS4 speaker (Bluetooth)</button>
    </p>
    <p>
      <label for="audioBufferAhead">Playback buffer</label>
      <select id="audioBufferAhead">
        <option value="0">0 ms (diagnostic comparison)</option>
        <option value="16">16 ms</option>
        <option value="32">32 ms</option>
        <option value="64" selected>64 ms (default)</option>
      </select>
    </p>
    <details id="audioDiagnostics" hidden>
      <summary>Playback timing (diagnostics)</summary>
      <pre id="audioTiming"></pre>
    </details>
    <p id="audioStatus" role="status">Select an audio file to convert it to SBC.</p>
    <div id="log"></div>
    <pre id="log2"></pre>
    <script type="module">
      import { audioToSbc, sbcToAudioBuffer } from "../src/web-dualshock.ts";
      const log = (msg) => {
        document.getElementById("log").textContent += msg + "\n";
      };
      const log2 = (msg) => {
        document.getElementById("log2").textContent = msg + "\n";
      };

      const colorPicker = document.getElementById("colorPicker");
      const lightbarRed = document.getElementById("colorRed");
      const lightbarGreen = document.getElementById("colorGreen");
      const lightbarBlue = document.getElementById("colorBlue");
      const softRumble = document.getElementById("softRumble");
      const heavyRumble = document.getElementById("heavyRumble");
      const lightBlink = document.getElementById("lightBlink");
      const lightBlinkOff = document.getElementById("lightBlinkOff");
      const musicFileInput = document.getElementById("musicFile");
      const previewAudio = document.getElementById("previewAudio");
      const sendAudio = document.getElementById("sendAudio");
      const audioStatus = document.getElementById("audioStatus");
      const audioBufferAhead = document.getElementById("audioBufferAhead");
      const audioDiagnostics = document.getElementById("audioDiagnostics");
      const audioTiming = document.getElementById("audioTiming");
      let ds = null;
      let sbcData = null;
      let previewContext = null;
      let audioBusy = false;
      const setAudioBusy = (busy) => {
        audioBusy = busy;
        musicFileInput.disabled = busy;
        audioBufferAhead.disabled = busy;
        previewAudio.disabled = busy || !sbcData;
        sendAudio.disabled = busy || !sbcData;
      };

      colorPicker.oninput = (ev) => {
        const color = ev.target.value;
        console.log("Selected color:", color);
        const r = parseInt(color.substr(1, 2), 16);
        const g = parseInt(color.substr(3, 2), 16);
        const b = parseInt(color.substr(5, 2), 16);
        ds.lightbar.r = r;
        ds.lightbar.g = g;
        ds.lightbar.b = b;
      };

      lightbarRed.onchange = (ev) => {
        console.log(ev.target.value);
        ds.lightbar.r = parseInt(ev.target.value);
      };
      lightbarGreen.onchange = (ev) => {
        console.log(ev.target.value);
        ds.lightbar.g = parseInt(ev.target.value);
      };
      lightbarBlue.onchange = (ev) => {
        console.log(ev.target.value);
        ds.lightbar.b = parseInt(ev.target.value);
      };

      softRumble.onchange = (ev) => {
        console.log(ev.target.value);
        ds.rumble.light = parseInt(ev.target.value);
      };

      heavyRumble.onchange = (ev) => {
        console.log(ev.target.value);
        ds.rumble.heavy = parseInt(ev.target.value);
      };

      lightBlink.onchange = (ev) => {
        console.log(ev.target.value);
        ds.lightbar.blinkOn = parseInt(ev.target.value);
      };

      lightBlinkOff.onchange = (ev) => {
        console.log(ev.target.value);
        ds.lightbar.blinkOff = parseInt(ev.target.value);
      };

      musicFileInput.onchange = async () => {
        const file = musicFileInput.files[0];
        if (!file) return;
        sbcData = null;
        setAudioBusy(true);
        audioStatus.textContent = "Converting audio?";
        try {
          if (previewContext) await previewContext.close();
          previewContext = null;
          sbcData = file.name.toLowerCase().endsWith(".sbc")
            ? new Uint8Array(await file.arrayBuffer())
            : await audioToSbc(file);
          audioStatus.textContent = `Ready: ${sbcData.length.toLocaleString()} bytes of SBC.`;
        } catch (error) {
          audioStatus.textContent = error.message;
        } finally {
          setAudioBusy(false);
        }
      };

      previewAudio.onclick = async () => {
        setAudioBusy(true);
        try {
          if (previewContext) await previewContext.close();
          const context = new AudioContext();
          previewContext = context;
          await context.resume();
          const source = context.createBufferSource();
          source.buffer = await sbcToAudioBuffer(sbcData);
          source.connect(context.destination);
          source.onended = () => {
            if (previewContext === context) previewContext = null;
            if (context.state !== "closed") context.close();
          };
          source.start();
          audioStatus.textContent = "Playing decoded SBC in the browser.";
        } catch (error) {
          if (previewContext) await previewContext.close();
          previewContext = null;
          audioStatus.textContent = error.message;
        } finally {
          setAudioBusy(false);
        }
      };

      sendAudio.onclick = async () => {
        setAudioBusy(true);
        audioDiagnostics.hidden = true;
        audioTiming.textContent = "";
        try {
          if (!ds || typeof ds.sendMusic !== "function") {
            throw new Error("Connect a PS4 controller over Bluetooth first.");
          }
          await ds.setVolume(0x38, 0x38, 0x00, 0x4f);
          audioStatus.textContent = "Playing on the controller...";
          await ds.sendMusic(sbcData, { bufferAheadMs: Number(audioBufferAhead.value) });
          audioTiming.textContent = JSON.stringify(ds.getAudioPlaybackStats(),
            (key, value) => typeof value === "number" ? Math.round(value * 100) / 100 : value, 2);
          audioDiagnostics.hidden = false;
          audioDiagnostics.open = true;
          audioStatus.textContent = "Controller playback finished.";
        } catch (error) {
          audioStatus.textContent = error.message;
        } finally {
          setAudioBusy(false);
        }
      };

      document.getElementById("connect").onclick = async () => {
        const dm = new DeviceManager();
        dm.$on("deviceconnected", async (device) => {
          log(`Device connected: ${device.getName()}`);
          await device.init();
          ds = device;
          window.ds = ds; // Expose for debugging
        });
        dm.requestDevice();

        log("Controller connected. Initial state:");
        let lastStatePaint = -100;
        function update(time = 0) {
          // The state itself stays live; pause the diagnostic DOM during audio.
          if (ds && !audioBusy && time - lastStatePaint >= 100) {
            log2(JSON.stringify(ds.state, null, 2));
            lastStatePaint = time;
          }
          requestAnimationFrame(update);
        }
        update();
      };
    </script>
  </body>
</html>
